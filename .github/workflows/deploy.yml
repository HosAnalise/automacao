# name: Docker Compose Build, Push and Deploy

on:
  push:
    branches:
      - prod
    paths:
      - 'classes/rotinas/**'
      - 'docker-compose.yml'
      - 'scripts/**'
      - 'testes/web/**'
      - 'docker/Dockerfile'

jobs:
  build-and-deploy: # Renomeado para refletir a ação completa
    runs-on: self-hosted

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      # PASSO CORRIGIDO: Apenas construir as imagens
      - name: Build das imagens Docker via Compose
        env:
          COMPOSE_BAKE: true
        run: docker-compose build

      # PASSO MANTIDO: Enviar as imagens para o registry
      - name: Push das imagens para o Docker Hub
        run: docker-compose push
      
      # PASSO DE DEPLOY CORRIGIDO E ROBUSTO
      - name: Deploy dos serviços com Docker Compose
        run: |
          # 1. Derruba qualquer versão antiga dos contêineres que possa estar rodando
          # Isso garante um deploy limpo e evita conflitos.
          docker-compose down

          # 2. Sobe os novos contêineres em modo detached (-d)
          # O Docker Daemon, que é um serviço do sistema, irá gerenciar os contêineres,
          # desvinculando-os do processo do runner.
          docker-compose up -d 
      
      # Verificação final para garantir que tudo subiu corretamente
      - name: Verificar status dos contêineres e imagens
        run: |
          echo "---- Imagens Locais ----"
          docker images
          echo "---- Contêineres em Execução ----"
          docker ps
          echo "---- Status dos Serviços do Compose ----"
          docker-compose ps