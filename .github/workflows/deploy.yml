name: Docker Compose Build and Push

on:
  push:
    branches:
      - prod
    paths:
      - 'classes/rotinas/**'
      - 'docker-compose.yml'
      - 'scripts/**'

jobs:
  build-and-push:
    # Use o runner self-hosted para todas as etapas
    runs-on: self-hosted

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # 1. Gera o arquivo no workspace do job
      - name: Compilar docker-compose.yml dinamicamente
        run: python scripts/build.py

      # 2. (Opcional, mas ótimo para depuração) Verifica se o arquivo foi criado corretamente
      - name: Verificar o docker-compose.yml gerado
        run: cat docker-compose.yml

      # 3. Faz o login no Docker Hub
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Usa o arquivo gerado para construir as imagens
      - name: Build das imagens do Docker Compose
        # Nota: O comando moderno é 'docker compose' (sem hífen)
        run: docker compose build

      # 5. Usa o mesmo arquivo para fazer o push
      - name: Push das imagens para o Docker Hub
        run: docker compose push